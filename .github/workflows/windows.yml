name: Windows build

# Builds the Windows desktop app in the cloud (no Windows machine needed),
# producing a portable zip and an Inno Setup installer. Run on demand, or on a
# version tag to attach the artifacts to a GitHub Release.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "App version (e.g. 1.1.1)"
        required: false
        default: "1.1.1"
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: beta
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build (release)
        run: flutter build windows --release

      - name: Derive version
        id: ver
        shell: pwsh
        run: |
          $v = "${{ github.event.inputs.version }}"
          if ([string]::IsNullOrWhiteSpace($v)) { $v = "${{ github.ref_name }}" -replace '^v','' }
          if ([string]::IsNullOrWhiteSpace($v)) { $v = "1.1.1" }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Package portable zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path build\windows\x64\runner\Release\* `
            -DestinationPath dist\OpenMontageStudio-windows-x64.zip -Force

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            /DMyAppVersion=${{ steps.ver.outputs.version }} windows\installer.iss

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openmontage-windows
          path: dist/*
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
